<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Arama motorlarında görünmemesi için gizlilik etiketi -->
    <meta name="robots" content="noindex, nofollow">
    <title>B ❤️ N | Sana Küçük Bir Sürprizim Var</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Piksel yazı tipi ve romantik modern yazı tipleri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Pacifico&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* Temel yazı tipi ve renk ayarları */
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #2a0818 0%, #12040b 100%);
            color: #fff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-pixel {
            font-family: 'Press Start 2P', cursive;
        }

        .font-romantic {
            font-family: 'Pacifico', cursive;
        }

        /* Arka plandaki hafif parlayan yıldız/toz efekti */
        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 182, 193, 0.3), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.2), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, rgba(255, 105, 180, 0.3), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, rgba(255, 255, 255, 0.2), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            z-index: 0;
        }

        /* Piksel Kalp Atış Animasyonu */
        @keyframes pixelPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .pixel-heart-wrapper {
            position: fixed;
            z-index: 30;
            cursor: pointer;
            transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.2s ease;
            touch-action: manipulation;
        }

        .pixel-heart-svg {
            animation: pixelPulse 1.1s infinite ease-in-out;
            filter: drop-shadow(0 0 18px rgba(255, 42, 95, 0.75));
            transition: transform 0.15s ease;
        }

        .pixel-heart-wrapper:active .pixel-heart-svg {
            transform: scale(0.9);
        }

        /* Ana Mesaj Giriş Animasyonu */
        @keyframes popReveal {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }
            70% {
                opacity: 1;
                transform: scale(1.05) translateY(-5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .reveal-animation {
            animation: popReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* B ❤️ N Parlama Efekti */
        .glow-text {
            text-shadow: 0 0 15px rgba(255, 77, 121, 0.8),
                         0 0 30px rgba(255, 42, 95, 0.6),
                         0 0 45px rgba(255, 42, 95, 0.4);
        }

        /* Arka planda süzülen minik kalpler */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.45;
            }
            80% {
                opacity: 0.45;
            }
            100% {
                transform: translateY(-15vh) scale(1.1);
                opacity: 0;
            }
        }

        .floating-bg-heart {
            position: fixed;
            bottom: -40px;
            pointer-events: none;
            z-index: 5;
            animation: floatUp linear infinite;
        }

        /* Parçacık Canvas Katmanı */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center">

    <!-- Arka Plan Yıldızları -->
    <div class="bg-stars"></div>

    <!-- Patlama Sonrası Arka Planda Süzülen Kalpler Konteyneri -->
    <div id="floating-hearts-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0 hidden"></div>

    <!-- Patlama ve Konfeti Efektleri İçin Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- =====================================================================
         1. AŞAMA: ETKİLEŞİMLİ PİKSEL KALP OYUNU EKRANI
         ===================================================================== -->
    <div id="intro-stage" class="fixed inset-0 z-20 flex flex-col items-center justify-between py-12 px-4 pointer-events-none">
        <!-- Üst İpucu Metni -->
        <div class="text-center mt-4 transition-opacity duration-300" id="hint-container">
            <p id="hint-text" class="font-pixel text-xs sm:text-sm text-pink-200 tracking-wider leading-relaxed drop-shadow">
                Kalbe dokun... ❤️
            </p>
            <!-- 5 Adımlı İlerleme Noktaları -->
            <div class="flex items-center justify-center gap-2.5 mt-4" id="progress-dots">
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500/30 border border-pink-400/50 transition-all duration-300"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500/30 border border-pink-400/50 transition-all duration-300"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500/30 border border-pink-400/50 transition-all duration-300"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500/30 border border-pink-400/50 transition-all duration-300"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500/30 border border-pink-400/50 transition-all duration-300"></span>
            </div>
        </div>

        <!-- Alt Bilgi -->
        <div class="text-center opacity-60">
            <p class="text-xs text-pink-200/70">Sana özel küçük bir sürpriz...</p>
        </div>
    </div>

    <!-- Zıplayan Piksel Kalp Butonu -->
    <div id="pixel-heart-btn" class="pixel-heart-wrapper p-3" aria-label="Piksel Kalp">
        <!-- 8-Bit Piksel Kalp SVG -->
        <svg class="pixel-heart-svg w-20 h-20 sm:w-24 sm:h-24" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <!-- Dış Siyah/Koyu Kontur -->
            <path d="M2 2H6V3H7V4H9V3H10V2H14V3H15V8H14V10H13V11H12V12H11V13H10V14H9V15H7V14H6V13H5V12H4V11H3V10H2V8H1V3H2V2Z" fill="#3b0716"/>
            <!-- Ana Kırmızı Dolgu -->
            <path d="M2 3H6V4H7V5H9V4H10V3H14V8H13V10H12V11H11V12H10V13H9V14H7V13H6V12H5V11H4V10H3V8H2V3Z" fill="#ff1e56"/>
            <!-- Açık Pembe Parlama (Sol Üst Piksel Işıltısı) -->
            <path d="M3 4H5V5H4V7H3V4Z" fill="#ffacbd"/>
            <!-- Gölge Tonu (Sağ Alt) -->
            <path d="M13 4H14V8H13V10H12V11H11V12H10V13H9V14H8V13H9V12H10V11H11V10H12V8H13V4Z" fill="#c70039"/>
        </svg>
    </div>

    <!-- =====================================================================
         2. AŞAMA: PATLAMA SONRASI EKRAN ORTASINDA ROMANTİK MESAJ
         ===================================================================== -->
    <main id="reveal-stage" class="hidden fixed inset-0 z-10 w-full h-full px-4 sm:px-6 flex-col items-center justify-center">
        
        <!-- Büyük Sürpriz Mesaj Kartı -->
        <section id="love-message-box" class="text-center p-8 sm:p-12 rounded-3xl bg-white/5 border border-pink-500/25 backdrop-blur-md shadow-[0_0_50px_rgba(255,30,86,0.2)] max-w-2xl w-full">
            <div class="inline-block px-4 py-1.5 rounded-full bg-pink-500/20 border border-pink-400/30 text-pink-200 text-xs sm:text-sm mb-6 tracking-wide">
                ✨ İyi ki hayatımdasın ✨
            </div>

            <h1 class="font-romantic text-4xl sm:text-6xl md:text-7xl text-pink-100 leading-tight mb-8 drop-shadow-lg">
                Seni çok seviyorum aşkım
            </h1>

            <!-- B ❤️ N İmzası -->
            <div class="flex items-center justify-center gap-5 sm:gap-7 my-4">
                <span class="font-pixel text-4xl sm:text-6xl md:text-7xl text-white glow-text">B</span>
                
                <!-- Ortadaki Piksel Kalp -->
                <svg class="w-12 h-12 sm:w-16 sm:h-16 pixel-heart-svg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                    <path d="M2 2H6V3H7V4H9V3H10V2H14V3H15V8H14V10H13V11H12V12H11V13H10V14H9V15H7V14H6V13H5V12H4V11H3V10H2V8H1V3H2V2Z" fill="#3b0716"/>
                    <path d="M2 3H6V4H7V5H9V4H10V3H14V8H13V10H12V11H11V12H10V13H9V14H7V13H6V12H5V11H4V10H3V8H2V3Z" fill="#ff1e56"/>
                    <path d="M3 4H5V5H4V7H3V4Z" fill="#ffacbd"/>
                </svg>

                <span class="font-pixel text-4xl sm:text-6xl md:text-7xl text-white glow-text">N</span>
            </div>
        </section>

        <!-- Alt Köşede Zarif Tekrar Oyna Butonu -->
        <div class="fixed bottom-5 right-5 z-20">
            <button id="replay-btn" class="px-4 py-2 rounded-full bg-white/5 hover:bg-pink-600/30 border border-pink-400/25 text-pink-200/80 hover:text-white text-xs backdrop-blur-sm transition-all active:scale-95 flex items-center gap-1.5 cursor-pointer">
                <span>🔄</span> Tekrar Oyna
            </button>
        </div>

    </main>

    <!-- =====================================================================
         JAVASCRIPT: KALP HAREKETİ, PATLAMA EFEKTİ VE ARKA PLAN KALPLERİ
         ===================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heartBtn = document.getElementById('pixel-heart-btn');
            const introStage = document.getElementById('intro-stage');
            const revealStage = document.getElementById('reveal-stage');
            const loveMessageBox = document.getElementById('love-message-box');
            const floatingHeartsContainer = document.getElementById('floating-hearts-container');
            const hintText = document.getElementById('hint-text');
            const progressDots = document.getElementById('progress-dots').children;
            const replayBtn = document.getElementById('replay-btn');
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');

            let clickCount = 0;
            const maxClicks = 5;
            let particles = [];
            let animationFrameId = null;

            // Arka planda yavaşça yükselen romantik piksel kalpler oluştur
            function createFloatingHearts() {
                floatingHeartsContainer.innerHTML = '';
                const count = 14;
                for (let i = 0; i < count; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'floating-bg-heart';
                    const left = Math.random() * 95;
                    const duration = 7 + Math.random() * 8;
                    const delay = Math.random() * 6;
                    const size = 14 + Math.floor(Math.random() * 14);

                    wrapper.style.left = `${left}%`;
                    wrapper.style.animationDuration = `${duration}s`;
                    wrapper.style.animationDelay = `${delay}s`;
                    wrapper.innerHTML = `
                        <svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                            <path d="M2 3H6V4H7V5H9V4H10V3H14V8H13V10H12V11H11V12H10V13H9V14H7V13H6V12H5V11H4V10H3V8H2V3Z" fill="#ff4d79"/>
                        </svg>
                    `;
                    floatingHeartsContainer.appendChild(wrapper);
                }
            }

            // Her tıklamada değişen sevimli mesajlar
            const playfulMessages = [
                "Kalbe dokun... ❤️",
                "Hop! Kaçtı, bir daha yakala! 😜",
                "Çok yaklaştın, devam et! ✨",
                "Az kaldı, kalbim hızlanıyor! 💓",
                "Son bir dokunuş daha! 💥"
            ];

            // Canvas boyutunu ekrana göre ayarla
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Kalbi başlangıçta tam ortaya yerleştir
            function centerHeart() {
                const rect = heartBtn.getBoundingClientRect();
                const startX = (window.innerWidth - rect.width) / 2;
                const startY = (window.innerHeight - rect.height) / 2;
                heartBtn.style.left = `${startX}px`;
                heartBtn.style.top = `${startY}px`;
            }

            // Kalbi ekran sınırları içinde rastgele güvenli bir yere taşı
            function moveHeartRandomly() {
                const rect = heartBtn.getBoundingClientRect();
                const padding = 24;
                const topSafeArea = 120; // Üstteki yazıların üstüne gelmesin
                const bottomSafeArea = 80;

                const minX = padding;
                const maxX = Math.max(padding + 10, window.innerWidth - rect.width - padding);
                const minY = topSafeArea;
                const maxY = Math.max(topSafeArea + 10, window.innerHeight - rect.height - bottomSafeArea);

                // Mevcut konumdan yeterince uzağa zıplamasını sağla
                let newX, newY;
                const currentX = parseFloat(heartBtn.style.left) || 0;
                const currentY = parseFloat(heartBtn.style.top) || 0;
                let attempts = 0;

                do {
                    newX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
                    newY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
                    attempts++;
                } while (Math.hypot(newX - currentX, newY - currentY) < 90 && attempts < 15);

                heartBtn.style.left = `${newX}px`;
                heartBtn.style.top = `${newY}px`;
            }

            // Parçacık (Piksel kalp ve konfeti) sınıfı
            class Particle {
                constructor(x, y, isExplosion = false) {
                    this.x = x;
                    this.y = y;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = isExplosion 
                        ? (Math.random() * 10 + 3) 
                        : (Math.random() * 4 + 1.5);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - (isExplosion ? 2 : 0);
                    this.gravity = isExplosion ? 0.18 : 0.08;
                    this.size = isExplosion ? (Math.random() * 12 + 8) : (Math.random() * 6 + 4);
                    this.alpha = 1;
                    this.decay = isExplosion ? (Math.random() * 0.012 + 0.008) : 0.03;
                    
                    const colors = ['#ff1e56', '#ff4d79', '#ffacbd', '#ffffff', '#ffd166', '#ff0055'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.isHeart = isExplosion ? Math.random() > 0.35 : Math.random() > 0.5;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.15;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.vx *= 0.98;
                    this.alpha -= this.decay;
                    this.rotation += this.rotationSpeed;
                }

                draw(ctx) {
                    if (this.alpha <= 0) return;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = this.color;

                    if (this.isHeart) {
                        // Küçük piksel tarzı kalp çizimi
                        const s = this.size / 5;
                        ctx.fillRect(-2*s, -s, s, s);
                        ctx.fillRect(-s, -2*s, s, s);
                        ctx.fillRect(0, -s, s, s);
                        ctx.fillRect(s, -2*s, s, s);
                        ctx.fillRect(2*s, -s, s, s);
                        ctx.fillRect(-2*s, 0, 5*s, s);
                        ctx.fillRect(-s, s, 3*s, s);
                        ctx.fillRect(0, 2*s, s, s);
                    } else {
                        // Piksel kare konfeti
                        ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                    }
                    ctx.restore();
                }
            }

            // Parçacık oluşturma tetikleyicisi
            function spawnParticles(x, y, count, isExplosion = false) {
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, isExplosion));
                }
                if (!animationFrameId) {
                    animateParticles();
                }
            }

            // Canvas animasyon döngüsü
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw(ctx);
                    if (particles[i].alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
                if (particles.length > 0) {
                    animationFrameId = requestAnimationFrame(animateParticles);
                } else {
                    animationFrameId = null;
                }
            }

            // İlerleme noktalarını güncelle
            function updateProgressDots(count) {
                for (let i = 0; i < progressDots.length; i++) {
                    if (i < count) {
                        progressDots[i].classList.remove('bg-pink-500/30');
                        progressDots[i].classList.add('bg-pink-500', 'scale-125', 'shadow-[0_0_8px_#ff1e56]');
                    } else {
                        progressDots[i].classList.add('bg-pink-500/30');
                        progressDots[i].classList.remove('bg-pink-500', 'scale-125', 'shadow-[0_0_8px_#ff1e56]');
                    }
                }
            }

            // Kalbe tıklama / dokunma olayı
            heartBtn.addEventListener('click', (e) => {
                // Mobil cihazlarda hafif titreşim geri bildirimi
                if (navigator.vibrate) {
                    navigator.vibrate(clickCount === 4 ? [80, 40, 120] : 35);
                }

                const rect = heartBtn.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                clickCount++;
                updateProgressDots(clickCount);

                if (clickCount < maxClicks) {
                    // 1. - 4. Tıklamalar: Küçük parçacıklar çıkar ve başka yere zıpla
                    spawnParticles(centerX, centerY, 14, false);
                    hintText.textContent = playfulMessages[clickCount] || playfulMessages[0];
                    
                    // Her tıklamada kalp biraz daha büyüsün
                    const scaleFactor = 1 + (clickCount * 0.08);
                    heartBtn.style.transform = `scale(${scaleFactor})`;
                    
                    moveHeartRandomly();
                } else if (clickCount === maxClicks) {
                    // 5. Tıklama: BÜYÜK PATLAMA!
                    heartBtn.style.display = 'none';
                    introStage.style.opacity = '0';

                    // Ekranın ortasında ve kalbin olduğu yerde devasa kalp patlaması
                    spawnParticles(centerX, centerY, 110, true);
                    setTimeout(() => {
                        spawnParticles(window.innerWidth / 2, window.innerHeight / 3, 70, true);
                    }, 250);

                    // Giriş ekranını gizle ve asıl sürpriz ekranını aç
                    setTimeout(() => {
                        introStage.classList.add('hidden');
                        revealStage.classList.remove('hidden');
                        revealStage.classList.add('flex');
                        loveMessageBox.classList.add('reveal-animation');
                        floatingHeartsContainer.classList.remove('hidden');
                        createFloatingHearts();
                    }, 300);
                }
            });

            // Tekrar Oyna Butonu
            replayBtn.addEventListener('click', () => {
                clickCount = 0;
                updateProgressDots(0);
                hintText.textContent = playfulMessages[0];
                
                revealStage.classList.add('hidden');
                revealStage.classList.remove('flex');
                loveMessageBox.classList.remove('reveal-animation');
                floatingHeartsContainer.classList.add('hidden');
                
                introStage.classList.remove('hidden');
                introStage.style.opacity = '1';
                
                heartBtn.style.display = 'block';
                heartBtn.style.transform = 'scale(1)';
                centerHeart();
            });

            // Sayfa ilk açıldığında kalbi ortala
            centerHeart();
            window.addEventListener('resize', () => {
                if (clickCount === 0) centerHeart();
            });
        });
    </script>
</body>
</html>
